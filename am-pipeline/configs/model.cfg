[nlp]
lang = "de"
pipeline = ["sentencizer", "transformer", "spancat"]
batch_size = 4
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[training]
train_corpus = "corpora.train"
dev_corpus = "corpora.dev"
seed = 42
gpu_allocator = "pytorch"
patience = 12000
max_steps = 40000
max_epochs = 30
eval_frequency = 800
dropout = 0.1
accumulate_gradient = 6
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[corpora]

[paths]
train = "data/darius/train.spacy"
dev = "data/darius/dev.spacy"
vectors = null
init_tok2vec = null

[system]
gpu_allocator = "pytorch"
seed = 42

[initialize]
vectors = null
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null
after_init = null

[components]

[pretraining]

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[nlp.vectors]
@vectors = "spacy.Vectors.v1"

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 2e-05

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = true
tolerance = 0.2
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = true

[training.score_weights]
spans_sc_f = 1.0
spans_sc_p = 0.0
spans_sc_r = 0.0

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 512
gold_preproc = false
limit = 0

[corpora.train.augmenter]
@augmenters = "spacy.synonym_augmenter.v1"
prob = 0.2

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[initialize.components]

[initialize.tokenizer]

[components.transformer]
factory = "transformer"
max_batch_items = 4096

[components.spancat]
factory = "spancat"
spans_key = "sc"
threshold = 0.3
max_positive = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 50
stop = 200
compound = 1.001
t = 0.0

[initialize.components.spancat]

[components.sentencizer]
factory = "sentencizer"

[components.transformer.model]
@architectures = "spacy-transformers.TransformerModel.v3"
name = "distilbert/distilbert-base-german-cased"
mixed_precision = true

[components.transformer.set_extra_annotations]
@annotation_setters = "spacy-transformers.null_annotation_setter.v1"

[components.spancat.model]
@architectures = "spacy.SpanCategorizer.v1"

[components.spancat.suggester]
@misc = "spacy.ngram_range_suggester.v1"
min_size = 5
max_size = 40

[components.spancat.scorer]
@scorers = "spacy.spancat_scorer.v1"

[components.transformer.model.get_spans]
@span_getters = "spacy-transformers.strided_spans.v1"
window = 128
stride = 64

[components.transformer.model.tokenizer_config]
use_fast = true

[components.transformer.model.transformer_config]

[components.transformer.model.grad_scaler_config]

[components.spancat.model.reducer]
@layers = "spacy.mean_max_reducer.v1"
hidden_size = 128

[components.spancat.model.scorer]
@layers = "spacy.LinearLogistic.v1"
nO = null
nI = null

[components.spancat.model.tok2vec]
@architectures = "spacy-transformers.TransformerListener.v1"
grad_factor = 1.0
upstream = "*"

[components.spancat.model.tok2vec.pooling]
@layers = "reduce_mean.v1"